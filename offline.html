<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline Mode | FM Continuum</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#070b12;--panel:#101a2acc;--txt:#e6edf8;--muted:#a8b6cb;--line:#2a3850;--accent:#56ccff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 80% 100%,#17508466,transparent 45%),#070b12;color:var(--txt);display:grid;place-items:center;padding:24px}
.card{max-width:760px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 25px 70px #0008}
h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,3rem)}p{color:var(--muted);line-height:1.65}.btn{margin-top:14px;display:inline-block;text-decoration:none;background:linear-gradient(135deg,#56ccff,#4aa7ff);color:#03121f;padding:10px 14px;border-radius:12px;font-weight:700}
.log{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0a111d;font:500 .88rem/1.5 ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<main class="card">
  <h1>Signal lost — offline mode enabled</h1>
  <p>FM Continuum is currently offline. Cached assets can still load, but live radio streams require a network connection.</p>
  <a href="/" class="btn">Try Reconnect</a>
  <div class="log" id="log"></div>
</main>
<script>
const lines=["[NET] Checking internet connectivity…","[WARN] No active network detected","[CACHE] Service worker cache available","[ACTION] Reconnect when internet is restored"];const log=document.getElementById('log');let i=0;(function push(){if(i<lines.length){log.textContent+=`${lines[i++]}\n`;setTimeout(push,420)}})();
</script>
</body>
</html>
