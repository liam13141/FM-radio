<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Page Not Found | FM Continuum</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#070b12;--panel:#111827cc;--txt:#e6edf8;--muted:#9fb0c9;--line:#2a3850;--accent:#56ccff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#12345a55,transparent 45%),#070b12;color:var(--txt);display:grid;place-items:center;padding:24px}
.card{max-width:760px;width:100%;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 25px 70px #0008}
.badge{display:inline-block;border:1px solid #377099;padding:4px 10px;border-radius:999px;color:#9fdfff;font-size:.8rem}
h1{font-size:clamp(2rem,6vw,3.8rem);margin:12px 0}p{color:var(--muted);line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);color:var(--txt);text-decoration:none;font-weight:600}
.btn.main{background:linear-gradient(135deg,#56ccff,#4aa7ff);border:none;color:#03121f}
code{background:#08101d;border:1px solid var(--line);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Error 404</span>
    <h1>We couldn’t tune to this page.</h1>
    <p>The URL you requested doesn’t exist or moved. Try returning to the main player or using diagnostics if you suspect a routing issue.</p>
    <p><code>Tip:</code> Press <strong>H</strong> to jump to home.</p>
    <div class="actions">
      <a class="btn main" href="/">Go to Player</a>
      <a class="btn" href="/help">Open Help</a>
      <a class="btn" href="/data">Diagnostics</a>
    </div>
  </main>
<script>addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')location.href='/'})</script>
</body>
</html>
